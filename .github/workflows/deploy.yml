name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The declared lint toolchain (eslint 9 + react hooks) lives in
      # devDependencies; PR #3 restored it after silently rotting because
      # CI only built. Run it on every push so toolchain regressions
      # surface immediately instead of shipping green while lint is dead.
      - name: Lint
        run: npm run lint

      - name: Build production assets
        run: npm run build
        env:
          # Preferred names (see .env.example): PRIMARY does geocoding +
          # autocomplete, SECONDARY is the HTTP 429 retry target.
          VITE_GEOAPIFY_KEY_PRIMARY: ${{ secrets.VITE_GEOAPIFY_KEY_PRIMARY }}
          VITE_GEOAPIFY_KEY_SECONDARY: ${{ secrets.VITE_GEOAPIFY_KEY_SECONDARY }}
          # Legacy names still resolve in lib/geo.js, so an existing pair of
          # repo secrets keeps working without being renamed.
          VITE_GEOAPIFY_KEY: ${{ secrets.VITE_GEOAPIFY_KEY }}
          VITE_GEOAPIFY_AUTOCOMPLETE_KEY: ${{ secrets.VITE_GEOAPIFY_AUTOCOMPLETE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
